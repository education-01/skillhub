[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillhub"
version = "0.1.0"
description = "Skill Management Platform for AI Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "aiohttp>=3.9",
    "rich>=13.0",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.1",
]

[project.scripts]
skillhub = "skillhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skillhub"]
